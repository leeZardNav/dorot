specialty_blurbs:
  family: צלמות וצלמים שמצלמים משפחות שלמות, בבית, בטבע או בסטודיו.
  children: צילומי ילדים בגילאי הגן ובית הספר, במשחק ובתנועה.
  one_year: צילומי יום הולדת ראשון, עוגה ראשונה והצעדים הראשונים.
  bat_mitzvah: פורטרטים של נערות ונערים על סף גיל מצוות, בסטודיו ובחוץ.
  maternity: צילומי הריון, לבד, בזוג או עם האחים והאחיות הגדולים.
  newborn: צילומי ניובורן בשבועות הראשונים, בבית או בסטודיו.
  generations: סבים, סבתות, הורים ונכדים בתמונה אחת.
  feminine: פורטרטים של נשים, במבט מעצים ומכבד.

