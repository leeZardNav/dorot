region_examples:
  center: תל אביב, רמת גן, גבעתיים, בני ברק, פתח תקווה, חולון, בת ים, קריית אונו, יהוד, ראש העין, שוהם, מודיעין
  shfela: ראשון לציון, נס ציונה, רחובות, באר יעקב, רמלה, לוד, יבנה, גן יבנה, גדרה, קריית עקרון, מזכרת בתיה
  sharon: הרצליה, רעננה, כפר סבא, הוד השרון, נתניה, אבן יהודה, חדרה, פרדס חנה, זכרון יעקב, בנימינה
  north: חיפה והקריות, נהריה, עכו, כרמיאל, נצרת, עפולה, טבריה, קריית שמונה, הגליל, העמקים, הגולן
  jerusalem: ירושלים, בית שמש, מבשרת ציון, מעלה אדומים, גוש עציון, מטה יהודה
  south: אשדוד, אשקלון, קריית גת, באר שבע, שדרות, נתיבות, אופקים, דימונה, ערד, אילת, הנגב

